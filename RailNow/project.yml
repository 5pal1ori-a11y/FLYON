name: RailNow
options:
  bundleIdPrefix: com.flight
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
targets:
  RailNow:
    type: application
    platform: iOS
    sources: [RailNow]
    info:
      path: RailNow/Info.plist
      properties:
        CFBundleDisplayName: TAGO 타고
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.navigation
        ITSAppUsesNonExemptEncryption: false   # HTTPS 표준 암호화만 사용
        SeoulSubwayKey: $(SEOUL_SUBWAY_API_KEY)
        DataGoKrKey: $(DATA_GO_KR_KEY)
        NSAppTransportSecurity:
          NSExceptionDomains:
            swopenapi.seoul.go.kr:   # 서울시 실시간 지하철 API는 http만 제공
              NSExceptionAllowsInsecureHTTPLoads: true
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flight.flyon
        PRODUCT_NAME: RailNow
        MARKETING_VERSION: "4.0"   # 같은 FLYON 앱 자리를 쓰는 다른 앱(최대 3.0)보다 높게 → TestFlight 기본 빌드가 TAGO 타고
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SEOUL_SUBWAY_API_KEY: ""   # 빌드 시 주입 (GitHub Secrets). 비어 있으면 미리보기 데이터로 동작
        DATA_GO_KR_KEY: ""         # 빌드 시 주입 (GitHub Secrets)
