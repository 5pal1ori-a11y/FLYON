name: Hanpyeong
options:
  bundleIdPrefix: com.flight
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
targets:
  Hanpyeong:
    type: application
    platform: iOS
    sources: [Hanpyeong]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flight.flyon
        PRODUCT_NAME: Hanpyeong
        MARKETING_VERSION: "1.2"   # FLYON(0.1.0)·구독온(1.0)·TRADEX(1.1)와 빌드 번호가 겹치지 않게 별도 버전
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 한평상회
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.simulation-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
