# TRADEX — 코인 모의투자 앱. 이 폴더에서 `xcodegen` 실행 → TRADEX.xcodeproj
name: TRADEX
options:
  bundleIdPrefix: com.flight
  deploymentTarget:
    iOS: "17.0"
targets:
  TRADEX:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: TRADEXWidget
    scheme: {}
    settings:
      base:
        # 지금은 FLYON 앱 레코드(com.flight.flyon)로 TestFlight 업로드. 정식 출시 땐 TRADEX 전용 번들 ID로 변경.
        PRODUCT_BUNDLE_IDENTIFIER: com.flight.flyon
        PRODUCT_NAME: TRADEX
        MARKETING_VERSION: "2.0"   # 같은 FLYON 앱 자리를 쓰는 다른 앱(1.x)보다 높게 → TestFlight 기본 빌드가 TRADEX
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TRADEX
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Sources/TRADEX.entitlements
        TRADEX_APP_PROFILE: ""
        PROVISIONING_PROFILE_SPECIFIER: $(TRADEX_APP_PROFILE)       # CI에서 주입 (없으면 비어 있음)
        SUPABASE_PROJECT_REF: ""   # 빌드 시 주입 (GitHub Secrets)
        SUPABASE_ANON_KEY: ""      # 빌드 시 주입 (공개 anon 키)

  # 홈 화면·잠금화면 위젯 + 선물 포지션 잠금화면(Live Activity)
  TRADEXWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flight.flyon.tradexwidget
        PRODUCT_NAME: TRADEXWidget
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TRADEX
        SKIP_INSTALL: YES
        TRADEX_WIDGET_PROFILE: ""
        PROVISIONING_PROFILE_SPECIFIER: $(TRADEX_WIDGET_PROFILE)    # CI에서 주입
