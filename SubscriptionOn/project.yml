name: SubscriptionOn
options:
  bundleIdPrefix: com.subon
  deploymentTarget:
    iOS: "17.0"
targets:
  SubscriptionOn:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flight.flyon
        PRODUCT_NAME: SubscriptionOn
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 구독온
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-White AppIcon-Blue"
        INFOPLIST_KEY_NSFaceIDUsageDescription: 앱 잠금을 위해 Face ID를 사용해요
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 결제 내역 캡처를 읽어 구독을 찾아드려요
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
