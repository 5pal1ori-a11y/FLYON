name: TRADEX TestFlight

# TRADEX 앱 전용. 수동 실행: Actions 탭 > TRADEX TestFlight > Run workflow
# 지금은 FLYON 앱 레코드(com.flight.flyon)로 올린다. 정식 출시 땐 TRADEX 전용 번들 ID·앱 레코드로 바꿀 것.
# 기기(UDID) 등록 없이 서명하기 위해, 실행마다 임시 배포 인증서/프로파일을 API로 만들고
# 업로드 후 삭제한다. (ci/apple_signing.py, FLYON과 같은 팀·시크릿 사용)
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TEAM_ID: F5XL8B63NU
  BUNDLE_ID: com.flight.flyon
  WIDGET_BUNDLE_ID: com.flight.flyon.tradexwidget
  CAPABILITIES: "APPLE_ID_AUTH"   # Sign in with Apple

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography

      - name: Generate Xcode project
        run: cd TRADEX && xcodegen generate

      - name: Write App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "Missing App Store Connect secrets" >&2; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: Create temporary signing assets
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          BUNDLE_IDS="$BUNDLE_ID,$WIDGET_BUNDLE_ID" "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/TRADEX/ci/apple_signing.py" setup "$RUNNER_TEMP/signing"

      - name: Install signing assets into a temporary keychain
        run: |
          set -euo pipefail
          SIGN="$RUNNER_TEMP/signing"
          KC="$RUNNER_TEMP/flyon-build.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$KC_PASS"

          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"

          # Apple 중간 인증서 (체인 검증용)
          for name in AppleWWDRCAG3 AppleWWDRCAG6; do
            curl -fsSL -o "$RUNNER_TEMP/$name.cer" "https://www.apple.com/certificateauthority/$name.cer" \
              && security import "$RUNNER_TEMP/$name.cer" -k "$KC" -T /usr/bin/codesign || true
          done

          security import "$SIGN/key.pem" -k "$KC" -t priv -f openssl -T /usr/bin/codesign
          security import "$SIGN/distribution.cer" -k "$KC" -t cert -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null

          security find-identity -v -p codesigning "$KC"
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/[0-9A-F]{40}/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "No valid signing identity found" >&2; exit 1; fi

          # 앱·위젯 프로파일 설치
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          python3 - "$SIGN" <<'PY'
          import json, os, shutil, sys
          sign = sys.argv[1]
          state = json.load(open(os.path.join(sign, "signing.json")))
          dest = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          for p in state["profiles"]:
              shutil.copy(os.path.join(sign, p["file"]), os.path.join(dest, p["uuid"] + ".mobileprovision"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"APP_PROFILE={state['profiles'][0]['name']}\n")
              f.write(f"WIDGET_PROFILE={state['profiles'][1]['name']}\n")
          PY

          {
            echo "KC=$KC"
            echo "IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Archive
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project TRADEX/TRADEX.xcodeproj \
            -scheme TRADEX \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TRADEX.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            TRADEX_APP_PROFILE="$APP_PROFILE" \
            TRADEX_WIDGET_PROFILE="$WIDGET_PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            CURRENT_PROJECT_VERSION="$((20000 + ${{ github.run_number }}))" \
            SUPABASE_PROJECT_REF="$SUPABASE_PROJECT_REF" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Export and upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${APP_PROFILE}</string>
              <key>${WIDGET_BUNDLE_ID}</key><string>${WIDGET_PROFILE}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TRADEX.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Cleanup (delete temporary certificate/profile, keychain, API key)
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ -f "$ASC_KEY_PATH" ] && [ -x "$RUNNER_TEMP/venv/bin/python" ]; then
            "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/TRADEX/ci/apple_signing.py" cleanup "$RUNNER_TEMP/signing" || echo "::warning::Cleanup failed; delete 'FLYON CI' certificates/profiles in the developer portal"
          fi
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
