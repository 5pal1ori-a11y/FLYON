name: TRADEX screenshots

# 시뮬레이터에서 TRADEX(디버그 빌드)를 띄워 거래소·자산·혜택·설정 화면을 캡처한다.
# 수동 실행: Actions 탭 > TRADEX screenshots > Run workflow. 결과는 artifacts의 tradex-screenshots
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd TRADEX && xcodegen generate

      - name: Build for simulator (Debug, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TRADEX/TRADEX.xcodeproj \
            -scheme TRADEX \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Boot simulator and capture
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c = c or [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'TRADEX.app' | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # 첫 실행: 자동 로그인 + 예시 데이터
          xcrun simctl launch "$UDID" "$BID" -autoLogin YES -demoData YES -screenshotTab exchange
          sleep 30
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            for t in exchange assets rewards settings; do
              xcrun simctl terminate "$UDID" "$BID" || true
              xcrun simctl launch "$UDID" "$BID" -autoLogin YES -screenshotTab "$t"
              sleep 14
              xcrun simctl io "$UDID" screenshot "shots/${mode}-${t}.png"
            done
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: tradex-screenshots
          path: shots/*.png
          retention-days: 7
