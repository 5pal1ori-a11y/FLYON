name: TRADEX screenshots

# 시뮬레이터에서 TRADEX(디버그 빌드)를 띄워 거래소·자산·혜택·설정 화면을 캡처한다.
# 수동 실행: Actions 탭 > TRADEX screenshots > Run workflow. 결과는 artifacts의 tradex-screenshots
on:
  workflow_dispatch: {}

permissions:
  contents: write   # 캡처 이미지를 tradex-screenshots 브랜치에 올리기 위함

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd TRADEX && xcodegen generate

      - name: Build for simulator (Debug, no signing)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project TRADEX/TRADEX.xcodeproj \
            -scheme TRADEX \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SUPABASE_PROJECT_REF="$SUPABASE_PROJECT_REF" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" | tail -5

      - name: Boot simulator and capture
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c = c or [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'TRADEX.app' | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          # 첫 실행: 자동 로그인 + 예시 데이터
          xcrun simctl launch "$UDID" "$BID" -autoLogin YES -demoData YES -screenshotTab exchange
          sleep 30
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            for t in exchange assets rewards settings; do
              xcrun simctl terminate "$UDID" "$BID" || true
              xcrun simctl launch "$UDID" "$BID" -autoLogin YES -screenshotTab "$t"
              sleep 14
              xcrun simctl io "$UDID" screenshot "shots/${mode}-${t}.png"
            done
            # 코인 상세 화면
            xcrun simctl terminate "$UDID" "$BID" || true
            xcrun simctl launch "$UDID" "$BID" -autoLogin YES -screenshotTab exchange -screenshotCoin KRW-BTC
            sleep 16
            xcrun simctl io "$UDID" screenshot "shots/${mode}-detail.png"
          done
          ls -la shots

      - name: Push screenshots to tradex-screenshots branch
        run: |
          set -euo pipefail
          # 작은 JPEG로 변환해 별도 브랜치(히스토리 없음)에 올린다. main에는 영향 없음
          mkdir -p out
          for f in shots/*.png; do sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out "out/$(basename "${f%.png}").jpg" >/dev/null; done
          cd out
          git init -q -b tradex-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "TRADEX screenshots (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tradex-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: tradex-screenshots
          path: shots/*.png
          retention-days: 7
