name: 등불지기 TestFlight

# 등불지기(Godot 게임, Lanternkeeper/) 전용.
# 수동 실행: Actions 탭 > 등불지기 TestFlight > Run workflow (이 파일이 main에 있어야 버튼이 보인다)
# 게임 브랜치(claude/lanternkeeper-game)에 Lanternkeeper/ 변경을 푸시해도 실행된다.
#
# 다른 앱과 같은 방식: 실행마다 임시 배포 인증서/프로파일을 API로 만들고 업로드 후 삭제한다.
# (ci/apple_signing.py, FLYON과 같은 팀·시크릿 사용. 새 시크릿 필요 없음)
# 기본값은 FLYON 앱 레코드(com.flight.flyon)로 올린다. 정식 출시 땐 전용 번들 ID와 앱 레코드를 만든 뒤
# Run workflow의 bundle_id 입력값(또는 아래 env 기본값)을 바꿀 것.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "번들 ID (App Store Connect에 이 번들의 앱 레코드가 있어야 함)"
        required: false
        default: "com.flight.flyon"
  push:
    branches: ["claude/lanternkeeper-game"]
    paths:
      - "Lanternkeeper/**"
      - ".github/workflows/testflight-lanternkeeper.yml"

permissions:
  contents: read

concurrency:
  group: testflight-lanternkeeper
  cancel-in-progress: false

env:
  TEAM_ID: F5XL8B63NU
  BUNDLE_ID: ${{ inputs.bundle_id || 'com.flight.flyon' }}
  CAPABILITIES: ""
  GODOT_VERSION: 4.5.1
  GAME_DIR: Lanternkeeper

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography

      - name: Cache Godot and iOS export template
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-macos-ios-${{ env.GODOT_VERSION }}

      - name: Download Godot and iOS export template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" "templates/ios.zip" "templates/version.txt" -d "$TPL"
          rm "$RUNNER_TEMP/templates.tpz" "$RUNNER_TEMP/godot.zip"

      - name: Import project and run game tests
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --headless --path "$GAME_DIR" --import || true
          "$GODOT" --headless --path "$GAME_DIR" -s tests/run_tests.gd

      - name: Write App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "Missing App Store Connect secrets" >&2; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: Create temporary signing assets
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/ci/apple_signing.py" setup "$RUNNER_TEMP/signing"

      - name: Install signing assets into a temporary keychain
        run: |
          set -euo pipefail
          SIGN="$RUNNER_TEMP/signing"
          KC="$RUNNER_TEMP/lanternkeeper-build.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$KC_PASS"

          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"

          # Apple 중간 인증서 (체인 검증용)
          for name in AppleWWDRCAG3 AppleWWDRCAG6; do
            curl -fsSL -o "$RUNNER_TEMP/$name.cer" "https://www.apple.com/certificateauthority/$name.cer" \
              && security import "$RUNNER_TEMP/$name.cer" -k "$KC" -T /usr/bin/codesign || true
          done

          security import "$SIGN/key.pem" -k "$KC" -t priv -f openssl -T /usr/bin/codesign
          security import "$SIGN/distribution.cer" -k "$KC" -t cert -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null

          security find-identity -v -p codesigning "$KC"
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/[0-9A-F]{40}/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "No valid signing identity found" >&2; exit 1; fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(python3 -c "import json;print(json.load(open('$SIGN/signing.json'))['profile_uuid'])")"
          PROFILE_NAME="$(python3 -c "import json;print(json.load(open('$SIGN/signing.json'))['profile_name'])")"
          cp "$SIGN/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "KC=$KC"
            echo "IDENTITY=$IDENTITY"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "BUILD_NUMBER=$((30000 + ${{ github.run_number }}))"
          } >> "$GITHUB_ENV"

      - name: Export Xcode project from Godot
        run: |
          set -euo pipefail
          cd "$GAME_DIR"
          python3 ci/configure_preset.py --team "$TEAM_ID" --bundle "$BUNDLE_ID" \
            --profile-uuid "$PROFILE_UUID" --build "$BUILD_NUMBER" --project-only
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" "$PWD/build/ios/Lanternkeeper.ipa" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -d build/ios/Lanternkeeper.xcodeproj || { echo "Godot did not create the Xcode project" >&2; exit 1; }

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$GAME_DIR/build/ios/Lanternkeeper.xcodeproj" \
            -scheme Lanternkeeper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lanternkeeper.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lanternkeeper.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "업로드 완료: 등불지기 1.0.0 (${BUILD_NUMBER}) → ${BUNDLE_ID}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Godot export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanternkeeper-godot-export-log
          path: ${{ runner.temp }}/godot-export.log
          if-no-files-found: ignore

      - name: Cleanup (delete temporary certificate/profile, keychain, API key)
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ -f "$ASC_KEY_PATH" ] && [ -x "$RUNNER_TEMP/venv/bin/python" ]; then
            "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/ci/apple_signing.py" cleanup "$RUNNER_TEMP/signing" || echo "::warning::Cleanup failed; delete 'FLYON CI' certificates/profiles in the developer portal"
          fi
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
