name: FLYON
options:
  bundleIdPrefix: com.example   # TODO: 본인 도메인으로 변경
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FLYON:
    type: application
    platform: iOS
    sources:
      - FLYON
    entitlements:
      path: FLYON/FLYON.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: FLYON/Info.plist
      properties:
        CFBundleDisplayName: FLYON
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.flyon   # TODO: 본인 Bundle ID로 변경
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""                           # TODO: Apple Developer Team ID
