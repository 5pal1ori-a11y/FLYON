name: FLYON
options:
  bundleIdPrefix: com.flight
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FLYON:
    type: application
    platform: iOS
    sources:
      - FLYON
    entitlements:
      path: FLYON/FLYON.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: production
    info:
      path: FLYON/Info.plist
      properties:
        CFBundleDisplayName: FLYON
        ITSAppUsesNonExemptEncryption: false   # HTTPS 표준 암호화만 사용
        SupabaseProjectRef: $(SUPABASE_PROJECT_REF)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
          - Pretendard-ExtraBold.otf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flight.flyon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPABASE_PROJECT_REF: ""   # 빌드 시 주입 (GitHub Secrets)
        SUPABASE_ANON_KEY: ""      # 빌드 시 주입 (공개 anon 키)
        DEVELOPMENT_TEAM: F5XL8B63NU
